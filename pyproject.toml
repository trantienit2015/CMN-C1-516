[project]
name = "cmn-c1-516"
version = "0.1.0"
description = "Enterprise AI-Generated Content Quality & Anti-Slop Validation Agent — AgentCore Template"
requires-python = ">=3.11"
# Framework dependency (agenticstar-agentcore): see README "Requirements".
# pyyaml is a real runtime dependency: both entry points (cli.py, src/api/server.py)
# import it to load config/config.yaml, and the PB-5 / PB-7 boundary tests read the
# same file to decide whether their assertions apply.
dependencies = [
    "agenticstar-agentcore[marketplace,openai]==1.0.3",
    "pyyaml==6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==5.0.0",
    "pytest-asyncio==1.4.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
    # pyyaml is a runtime dependency (config loading), so type-check needs its stubs;
    # without them mypy reports the yaml import as missing on every run.
    "types-PyYAML==6.0.12.20260518",
]

[build-system]
requires = ["setuptools==68.2.2"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
# stubs/ declares the fields of the framework's AgentState, so this template's State
# is checked as a TypedDict, NotRequired fields included.
mypy_path = "stubs"

# framework and shared are imported for their base classes and contracts; this project
# type-checks its own code, not theirs.
[[tool.mypy.overrides]]
module = ["framework", "framework.*", "shared.*"]
ignore_missing_imports = true

# Nodes, graphs and service clients here derive from framework base classes.
[[tool.mypy.overrides]]
module = ["src.*"]
disallow_subclassing_any = false
